# Nginx reverse proxy / load balancer for the carpool backend.
#
# The actual multi-core load balancing is done by PM2 cluster mode (see
# ../ecosystem.config.cjs) — every PM2 worker binds the SAME port via
# Node's cluster module, so this file only needs one upstream target,
# not a list of ports to round-robin between. Nginx's job here is:
# terminate TLS, sit in front of that one port, and correctly forward
# both plain REST requests and the long-lived Socket.IO connection chat/
# notifications depend on.
#
# Install: copy/symlink this into /etc/nginx/sites-available/, symlink
# into sites-enabled/, `nginx -t` to validate, then `systemctl reload
# nginx`. Replace api.example.com and the certbot paths with your real
# domain — see DEPLOY.md for the end-to-end steps including certbot.

upstream carpool_backend {
    server 127.0.0.1:4000;
    keepalive 64;
}

# Shared by every server block in this http{} context that proxies
# WebSocket upgrades — must be declared at this level (not inside
# server{}), which is why it's up here rather than next to its one use
# below.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name api.example.com;

    # Uncomment after running certbot (see DEPLOY.md) — redirects all
    # plain HTTP to HTTPS instead of proxying it directly.
    # return 301 https://$host$request_uri;

    location = /health {
        proxy_pass http://carpool_backend/health;
        access_log off;
    }

    location / {
        proxy_pass http://carpool_backend;
        proxy_http_version 1.1;

        # Required for Socket.IO: without the Upgrade/Connection headers,
        # Nginx proxies the WebSocket handshake as a plain HTTP request
        # and the connection silently falls back to (much chattier, higher
        # latency) long-polling instead of a real WebSocket — chat and
        # live-tracking still work, just worse. $connection_upgrade below
        # only sends "upgrade" when the client actually asked to upgrade,
        # "close" otherwise, so plain REST calls are unaffected.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Real client IP through to Express — needed for rate limiting
        # (middleware/rateLimit.js keys on req.ip) to see the actual
        # caller instead of this proxy's own address. Matches
        # `app.set("trust proxy", 1)` in src/index.js, which trusts
        # exactly this one hop.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Socket.IO connections are long-lived by design — Nginx's
        # default 60s read/send timeout would silently drop an idle-but-
        # still-open chat connection.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # listen 443 ssl; ... — added automatically by `certbot --nginx`,
    # see DEPLOY.md. Not hand-written here since the exact cert paths
    # are host-specific.
}
